  <h1>日常记账技术支持</h1>
  <h2>常见问题</h2>
  <p><strong>数据保存在哪里？</strong><br>当前版本把数据保存在设备本地，不上传服务器，也不提供云同步。</p>
  <p><strong>更换设备后数据会自动恢复吗？</strong><br>不会。当前版本没有云端备份功能，请在删除 App 或更换设备前确认数据是否需要保留。</p>
  <p><strong>如何反馈问题？</strong><br>请描述设备型号、iOS 版本、操作步骤和问题截图，并发送至 <strong>待填写开发者联系邮箱</strong>。</p>
  <h2>联系开发者</h2>
  <p>邮箱：<strong>待填写开发者联系邮箱</strong></p>
  <p>我们会根据问题描述尽快回复。</p>
